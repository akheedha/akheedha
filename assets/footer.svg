<svg viewBox="0 0 850 100" width="100%" height="100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007A">
        <animate attributeName="stop-color" values="#FF007A;#7928CA;#06B6D4;#FF007A" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7928CA">
        <animate attributeName="stop-color" values="#7928CA;#06B6D4;#FF007A;#7928CA" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#FF007A;#7928CA;#06B6D4" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>

  <style>
    .footer-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      fill: #E2E8F0;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- Waving Path -->
  <path d="M 0 30 Q 212 0 425 30 T 850 30 L 850 100 L 0 100 Z" fill="url(#footerGrad)" opacity="0.85">
    <animate attributeName="d" 
      values="M 0 30 Q 212 0 425 30 T 850 30 L 850 100 L 0 100 Z;
              M 0 40 Q 212 60 425 35 T 850 40 L 850 100 L 0 100 Z;
              M 0 30 Q 212 0 425 30 T 850 30 L 850 100 L 0 100 Z" 
      dur="6s" repeatCount="indefinite" />
  </path>

  <text x="425" y="75" text-anchor="middle" class="footer-text">Designed &amp; Built with 💖 by Akheedha Jan</text>
</svg>
