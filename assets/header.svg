<svg viewBox="0 0 850 200" width="100%" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Animated Border & Text Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007A">
        <animate attributeName="stop-color" values="#FF007A;#7928CA;#06B6D4;#FF007A" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#7928CA">
        <animate attributeName="stop-color" values="#7928CA;#06B6D4;#FF007A;#7928CA" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#06B6D4">
        <animate attributeName="stop-color" values="#06B6D4;#FF007A;#7928CA;#06B6D4" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF007A" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 38px;
      font-weight: 800;
      fill: url(#neonGrad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      fill: #94A3B8;
      letter-spacing: 0.5px;
    }
    .tag {
      font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
      font-size: 12px;
      font-weight: 600;
      fill: #38BDF8;
      letter-spacing: 1.5px;
    }
    .star {
      animation: twinkle 3s infinite ease-in-out;
    }
  </style>

  <!-- Background Card -->
  <rect x="2" y="2" width="846" height="196" rx="16" fill="url(#bgGrad)" stroke="url(#neonGrad)" stroke-width="2" />

  <!-- Ambient Glow Orbs -->
  <circle cx="120" cy="50" r="60" fill="#FF007A" opacity="0.15" filter="url(#glow)" />
  <circle cx="730" cy="140" r="70" fill="#06B6D4" opacity="0.15" filter="url(#glow)" />

  <!-- Decorative Wave Path at Bottom -->
  <path d="M 2 150 Q 212 180 425 150 T 848 150 L 848 196 L 2 196 Z" fill="url(#waveGrad)" opacity="0.25">
    <animate attributeName="d" 
      values="M 2 150 Q 212 180 425 150 T 848 150 L 848 196 L 2 196 Z;
              M 2 160 Q 212 130 425 160 T 848 160 L 848 196 L 2 196 Z;
              M 2 150 Q 212 180 425 150 T 848 150 L 848 196 L 2 196 Z" 
      dur="6s" repeatCount="indefinite" />
  </path>
  
  <path d="M 2 165 Q 212 140 425 165 T 848 165 L 848 196 L 2 196 Z" fill="url(#waveGrad)" opacity="0.4">
    <animate attributeName="d" 
      values="M 2 165 Q 212 140 425 165 T 848 165 L 848 196 L 2 196 Z;
              M 2 155 Q 212 175 425 155 T 848 155 L 848 196 L 2 196 Z;
              M 2 165 Q 212 140 425 165 T 848 165 L 848 196 L 2 196 Z" 
      dur="5s" repeatCount="indefinite" />
  </path>

  <!-- Twinkling Sparkles -->
  <circle cx="80" cy="40" r="2" fill="#FF007A">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="780" cy="60" r="2.5" fill="#06B6D4">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="680" cy="35" r="1.5" fill="#FACC15">
    <animate attributeName="opacity" values="0.1;0.9;0.1" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="160" cy="140" r="2" fill="#A855F7">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite" />
  </circle>

  <!-- Header Title -->
  <text x="425" y="75" text-anchor="middle" class="title">✨ Akheedha Jan ✨</text>

  <!-- Subtitle -->
  <text x="425" y="110" text-anchor="middle" class="subtitle">Full Stack Software Engineer • AI &amp; Cloud Product Builder</text>

  <!-- Stack Tag Pill -->
  <g transform="translate(265, 128)">
    <rect width="320" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="160" y="17" text-anchor="middle" class="tag">REACT • DJANGO • NODE.JS • GEMINI AI</text>
  </g>
</svg>
