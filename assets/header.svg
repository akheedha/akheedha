<svg viewBox="0 0 900 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E" />
      <stop offset="50%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#0A0F1D" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.5" />
    </linearGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F1F5F9" />
      <stop offset="80%" stop-color="#93C5FD" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Ambient Glows -->
    <radialGradient id="glowLeft" cx="10%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowRight" cx="90%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dotGrid" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-size: 38px;
      font-weight: 800;
      fill: url(#titleGrad);
      letter-spacing: 1.5px;
    }
    .role-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      font-weight: 400;
      fill: #94A3B8;
      letter-spacing: 0.5px;
    }
    .status-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, monospace;
      font-size: 11px;
      font-weight: 600;
      fill: #38BDF8;
      letter-spacing: 1px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'SFMono-Regular', Consolas, monospace;
      font-size: 11.5px;
      font-weight: 500;
      fill: #CBD5E1;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- Background Base -->
  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Glow Effects -->
  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#glowLeft)" />
  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#glowRight)" />

  <!-- Grid Overlay -->
  <rect x="2" y="2" width="896" height="216" rx="14" fill="url(#dotGrid)" />

  <!-- Corner Accents (Subtle Modern Tech Aesthetic) -->
  <path d="M 20 35 L 20 20 L 35 20" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.6" />
  <path d="M 880 35 L 880 20 L 865 20" fill="none" stroke="#818CF8" stroke-width="2" opacity="0.6" />
  <path d="M 20 185 L 20 200 L 35 200" fill="none" stroke="#818CF8" stroke-width="2" opacity="0.6" />
  <path d="M 880 185 L 880 200 L 865 200" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0.6" />

  <!-- Top Pill / Status Badge -->
  <g transform="translate(325, 24)">
    <rect width="250" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1" />
    <circle cx="20" cy="13" r="4" fill="#10B981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="17" class="status-text">AVAILABLE FOR OPPORTUNITIES</text>
  </g>

  <!-- Main Name Title -->
  <text x="450" y="94" text-anchor="middle" class="name-title">AKHEEDHA JAN</text>

  <!-- Subtitle -->
  <text x="450" y="126" text-anchor="middle" class="role-subtitle">Software Engineer • Full-Stack Web &amp; Mobile Development • AI Systems</text>

  <!-- Tech Highlights Strip -->
  <g transform="translate(195, 154)">
    <rect width="510" height="34" rx="8" fill="#0F172A" stroke="#1E293B" stroke-width="1" opacity="0.9" />
    
    <!-- Tech stack pills / labels -->
    <text x="255" y="22" text-anchor="middle" class="pill-text">
      <tspan fill="#38BDF8">React / Vite</tspan>
      <tspan fill="#64748B">  •  </tspan>
      <tspan fill="#818CF8">Django &amp; DRF</tspan>
      <tspan fill="#64748B">  •  </tspan>
      <tspan fill="#34D399">Node.js</tspan>
      <tspan fill="#64748B">  •  </tspan>
      <tspan fill="#A78BFA">PostgreSQL</tspan>
      <tspan fill="#64748B">  •  </tspan>
      <tspan fill="#F472B6">AI Integrations</tspan>
    </text>
  </g>
</svg>
